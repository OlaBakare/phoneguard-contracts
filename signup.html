<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up | PhoneGuard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a href="index.html" class="auth-brand" aria-label="Back to PhoneGuard home">
      <img src="logo.svg" alt="PhoneGuard" width="220" height="66" />
    </a>
    <section class="auth-card">
      <p class="eyebrow">Create account</p>
      <h1>Start protecting device decisions today.</h1>
      <form>
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Ola Bakare" required />
        <label for="signup-email">Email address</label>
        <input id="signup-email" type="email" placeholder="you@example.com" required />
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" placeholder="Create a password" required />
        <a href="dashboard.html" class="btn btn-lime">Create Workspace</a>
      </form>
      <p class="form-note">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
