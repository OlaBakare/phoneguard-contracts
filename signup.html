<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up | PhoneGuard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (systemDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body class="auth-body">
  <main class="auth-shell">
    <div class="auth-header">
      <a href="index.html" class="auth-brand" aria-label="Back to PhoneGuard home">
        <img src="logo.svg" alt="PhoneGuard" width="220" height="66" />
      </a>
      <button type="button" class="wallet-btn" id="walletConnect" aria-label="Connect wallet">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H7M21 12l-4-4m4 4l-4 4"/></svg> Connect Wallet
      </button>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <span class="theme-toggle-text">Dark</span>
      </button>
    </div>
    <section class="auth-card">
      <p class="eyebrow">Create account</p>
      <h1>Start protecting device decisions today.</h1>
      <form>
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Ola Bakare" required />
        <label for="signup-email">Email address</label>
        <input id="signup-email" type="email" placeholder="you@example.com" required />
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" placeholder="Create a password" required />
        <a href="dashboard.html" class="btn btn-lime">Create Workspace</a>
      </form>
      <p class="form-note">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
  <script src="web3.js"></script>
  <script src="script.js"></script>
</body>
</html>
